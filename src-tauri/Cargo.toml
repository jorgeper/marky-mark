[package]
name = "marky-mark"
version = "0.5.0-alpha.2"
description = "A lightweight, fast, themeable markdown viewer"
license = "MIT"
edition = "2021"

[lib]
name = "marky_mark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# SPEC35 §1: move-to-Trash for the sidebar delete. No network, no features.
trash = "5"
tauri-plugin-clipboard-manager = "2.3.2"
# PRD 011 Req 12: the HTTP client behind the `llm_request` command — the one
# place a provider is contacted. Already in the lock file (0.13.4, rustls) via
# tauri-plugin-updater, so this edge adds no package and no second TLS stack;
# default features stay off and the features the updater already enables are
# what this uses.
reqwest = { version = "0.13", default-features = false }
# PRD 011 Req 12: not a second TLS stack — the same rustls 0.23 the updater
# already depends on, with the same `ring` provider, so the lock gains no
# package. It is here because the updater's reqwest is built `rustls-no-provider`
# and reqwest *panics* if no process-level provider is installed; the updater
# installs one only when it checks for updates, which the LLM path must not
# depend on. See `llm_client` in src/lib.rs.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
